spring:
  application:
    name: backend
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  datasource:
    # Defaults point at the local Docker dev container (mongil_basket_postgres,
    # localhost:5434). Override via env vars for any other environment.
    url: ${DB_URL:jdbc:postgresql://localhost:5434/mongil_basket}
    username: ${DB_USERNAME:mongil_basket}
    password: ${DB_PASSWORD:mongil_basket_dev}

server:
  port: 8080

app:
  jwt:
    # Must be set via env var — no default, so the app refuses to start
    # with a missing/weak secret. Generate one with: openssl rand -base64 64
    secret: ${JWT_SECRET}
    access-token-expiration-minutes: 15
    refresh-token-expiration-days: 30
