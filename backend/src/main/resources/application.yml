spring:
  application:
    name: backend
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  datasource:
    # Defaults point at the local Docker dev container (mongil_basket_postgres,
    # localhost:5434). Override via env vars for any other environment.
    url: ${DB_URL:jdbc:postgresql://localhost:5434/mongil_basket}
    username: ${DB_USERNAME:mongil_basket}
    password: ${DB_PASSWORD:mongil_basket_dev}
  mail:
    # Gmail SMTP with an app password (not the account's real password).
    # Left blank by default so local dev without these env vars set can
    # still start -- CoachService logs a warning and skips the send
    # instead of failing coach creation when they're unset.
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  # Render (and most PaaS hosts) inject PORT and route traffic to whatever
  # the container actually binds to -- a hardcoded 8080 here would leave
  # Render's proxy connecting fine but getting no response, since the app
  # would be listening on the wrong port. Falls back to 8080 for local dev
  # and the Docker Compose path, where nothing sets PORT.
  port: ${PORT:8080}

app:
  jwt:
    # Must be set via env var — no default, so the app refuses to start
    # with a missing/weak secret. Generate one with: openssl rand -base64 64
    secret: ${JWT_SECRET}
    access-token-expiration-minutes: 15
    refresh-token-expiration-days: 30
