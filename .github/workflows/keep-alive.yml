name: Keep backend + database warm

# Render's free web service spins down after ~15 min with no inbound HTTP
# traffic, and Neon's free Postgres separately autosuspends its compute
# after its own idle window. Neither can be prevented from inside the app
# once it's asleep, so this pings /api/health (which also runs a trivial
# DB query) from outside every 10 minutes to keep both from ever going
# idle long enough to sleep.
#
# Caveat: GitHub's scheduled workflows are not real-time -- runs can be
# delayed by several minutes under load, so this reduces cold starts but
# doesn't guarantee zero. For a stronger guarantee, add a free external
# uptime monitor (e.g. UptimeRobot, cron-job.org) pointed at the same
# GET https://mongilbasketrades.onrender.com/api/health URL.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: curl -sf -m 30 https://mongilbasketrades.onrender.com/api/health
