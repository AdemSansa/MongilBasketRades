name: Keep backend + database warm

# Render's free web service spins down after ~15 min with no inbound HTTP
# traffic, and Neon's free Postgres separately autosuspends its compute
# after its own idle window. Neither can be prevented from inside the app
# once it's asleep, so this pings /api/health (which also runs a trivial
# DB query) from outside every 10 minutes to keep both from ever going
# idle long enough to sleep.
#
# Confirmed unreliable in practice: GitHub ran this hours apart instead of
# every 10 minutes (throttles scheduled workflows hard on repos like this
# one), so it does not actually prevent Render's 15-min idle spin-down.
# Kept as a low-value backup ping; add a free external uptime monitor
# (e.g. UptimeRobot, cron-job.org) pointed at
# GET https://mongilbasketrades.onrender.com/api/health for the real fix.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        # 90s, not 30s: a cold Render instance takes up to ~60s to wake, and
        # a too-short timeout meant every ping during a cold start failed
        # right as it was doing its job.
        run: curl -sf -m 90 https://mongilbasketrades.onrender.com/api/health
