@if (total() > 0) {
  <div class="pagination-bar">
    <span class="range">
      Showing {{ rangeStart() }}–{{ rangeEnd() }} of {{ total() }}
    </span>
    <div class="controls">
      <button type="button" [disabled]="page() === 1" (click)="goToPrevious()">Previous</button>
      <span class="page-indicator">Page {{ page() }} of {{ totalPages() }}</span>
      <button type="button" [disabled]="page() === totalPages()" (click)="goToNext()">Next</button>
    </div>
  </div>
}
