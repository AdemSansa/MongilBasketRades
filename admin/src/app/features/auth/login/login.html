<div class="login-page">
  <form class="login-card" [formGroup]="form" (ngSubmit)="submit()">
    <img src="logo.jpg" alt="Mongil Basket Rades" class="brand-logo" />
    <h1>Mongil Basket Rades</h1>
    <p class="subtitle">Admin sign in</p>

    <label>
      Email
      <input type="email" formControlName="email" autocomplete="username" />
    </label>
    @if (form.controls.email.invalid && form.controls.email.touched) {
      <p class="field-error">Enter a valid email</p>
    }

    <label>
      Password
      <input type="password" formControlName="password" autocomplete="current-password" />
    </label>
    @if (form.controls.password.invalid && form.controls.password.touched) {
      <p class="field-error">Password is required</p>
    }

    @if (errorMessage()) {
      <p class="form-error">{{ errorMessage() }}</p>
    }

    <button type="submit" [disabled]="isLoading()">
      {{ isLoading() ? 'Signing in…' : 'Sign in' }}
    </button>
  </form>
</div>
